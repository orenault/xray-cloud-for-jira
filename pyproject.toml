[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "xray-cloud-for-jira"
version = "0.1.0"
description = "Python client for Xray Cloud (GraphQL + REST) with automatic Jira issueId resolution"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "orenault" }
]
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0"
]
keywords = [
  "xray",
  "jira",
  "graphql",
  "test-management",
  "qa",
  "automation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/orenault/xray-cloud-for-jira"
Repository = "https://github.com/orenault/xray-cloud-for-jira"
Issues = "https://github.com/orenault/xray-cloud-for-jira/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_cloud_for_jira"]
